services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexarvia
      POSTGRES_PASSWORD: nexarvia
      POSTGRES_DB: nexarvia
    ports:
      - "5432:5432"
    volumes:
      - nexarvia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U nexarvia -d nexarvia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql://nexarvia:nexarvia@postgres:5432/nexarvia?schema=public
      JWT_SECRET: change-this-in-production
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

volumes:
  nexarvia-postgres:
